        <h1>روايتي (Roayti) — منصة الروايات والذكاء الاصطناعي (AI)</h1>
        <p>مرحباً بك في منصة روايتي، البيئة المثالية لكتابة وقراءة الروايات العربية والقصص القصيرة باستخدام تقنيات الذكاء الاصطناعي المتطورة.</p>

        <h2>أقسام المنصة الأساسية:</h2>
        <ul>
          <li><strong>اكتشف الروايات (Explore):</strong> تصفح أحدث الروايات والقصص المنشورة في العالم العربي.</li>
          <li><strong>الأكثر قراءة (Most Read):</strong> تابع الروايات الأكثر تفاعلاً وشهرة بين القراء.</li>
          <li><strong>المكتبة الشخصية (Library):</strong> مكانك الخاص لحفظ رواياتك المفضلة ومتابعة التقدم في القراءة.</li>
          <li><strong>لوحة الكتابة (Dashboard):</strong> مساحتك الإبداعية الخاصة ككاتب لإدارة فصولك وإحصائياتك وتتبع أدائك.</li>
          <li><strong>الكاتب الذكي (AI Writer):</strong> مساعدك الشخصي القائم على الذكاء الاصطناعي لتوليد الأفكار، الحبكات، وتطوير الشخصيات.</li>
        </ul>
