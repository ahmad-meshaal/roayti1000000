services:
  - type: web
    name: roayti-web
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roayti-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        value: XIFc/OSVPMosQcuqglBu1FLyshtSWWiCIswCuwM2ZQop1XrgWXWZHMptBTUtWvMJOFsB8kD6GOgswScrCjMPbw==
      - key: VITE_GEMINI_API_KEY
        value: XIFc/OSVPMosQcuqglBu1FLyshtSWWiCIswCuwM2ZQop1XrgWXWZHMptBTUtWvMJOFsB8kD6GOgswScrCjMPbw==

databases:
  - name: roayti-db
    databaseName: roayti_com
    user: roayti_user
    plan: free
